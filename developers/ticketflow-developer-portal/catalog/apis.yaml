---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: inquiries-api
  description: REST API for submitting and managing customer inquiries
  tags:
    - rest
    - inquiries
spec:
  type: openapi
  lifecycle: production
  owner: group:ticketflow-team-1
  system: ticketflow
  definition: |
    openapi: 3.0.0
    info:
      title: Inquiries API
      version: 1.0.0
      description: API for submitting and managing customer inquiries
    servers:
      - url: http://localhost:5011
    paths:
      /:
        get:
          summary: Health check
          responses:
            '200':
              description: Service is healthy
      /inquiries:
        get:
          summary: List inquiries with pagination
          parameters:
            - name: page
              in: query
              schema:
                type: integer
            - name: limit
              in: query
              schema:
                type: integer
          responses:
            '200':
              description: List of inquiries
      /inquiries/submit:
        post:
          summary: Submit inquiry (async or sync based on feature flags)
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    title:
                      type: string
                    content:
                      type: string
                    email:
                      type: string
          responses:
            '202':
              description: Inquiry submitted
      /inquiries/submit-sync:
        post:
          summary: Submit inquiry synchronously
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  type: object
          responses:
            '200':
              description: Inquiry submitted and processed

---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: tickets-api
  description: REST API for ticket lifecycle management, assignments, and resolutions
  tags:
    - rest
    - tickets
    - agents
spec:
  type: openapi
  lifecycle: production
  owner: group:ticketflow-team-1
  system: ticketflow
  definition: |
    openapi: 3.0.0
    info:
      title: Tickets API
      version: 1.0.0
      description: API for ticket lifecycle management
    servers:
      - url: http://localhost:5112
    paths:
      /:
        get:
          summary: Health check
          responses:
            '200':
              description: Service is healthy
      /tickets:
        get:
          summary: List tickets with filtering
          parameters:
            - name: agentId
              in: query
              schema:
                type: string
            - name: status
              in: query
              schema:
                type: string
            - name: page
              in: query
              schema:
                type: integer
            - name: limit
              in: query
              schema:
                type: integer
          responses:
            '200':
              description: List of tickets
        post:
          summary: Create ticket synchronously
          responses:
            '201':
              description: Ticket created
      /tickets/{ticketId}:
        get:
          summary: Get ticket details
          parameters:
            - name: ticketId
              in: path
              required: true
              schema:
                type: string
          responses:
            '200':
              description: Ticket details
      /tickets/{ticketId}/qualify:
        post:
          summary: Qualify ticket
          parameters:
            - name: ticketId
              in: path
              required: true
              schema:
                type: string
          responses:
            '200':
              description: Ticket qualified
      /tickets/{ticketId}/assign/{agentId}:
        post:
          summary: Assign agent to ticket
          parameters:
            - name: ticketId
              in: path
              required: true
              schema:
                type: string
            - name: agentId
              in: path
              required: true
              schema:
                type: string
          responses:
            '200':
              description: Agent assigned
      /tickets/{ticketId}/block/{reason}:
        post:
          summary: Block ticket
          responses:
            '200':
              description: Ticket blocked
      /tickets/{ticketId}/unblock/{reason}:
        post:
          summary: Unblock ticket
          responses:
            '200':
              description: Ticket unblocked
      /tickets/{ticketId}/resolve/{resolution}:
        post:
          summary: Resolve ticket
          responses:
            '200':
              description: Ticket resolved
      /tickets/{ticketId}/client-notes:
        get:
          summary: Get client notes for ticket
          responses:
            '200':
              description: Client notes
        post:
          summary: Add client note
          responses:
            '201':
              description: Note added
      /agents:
        get:
          summary: List all agents
          responses:
            '200':
              description: List of agents
      /agents/{id}:
        get:
          summary: Get agent by ID
          responses:
            '200':
              description: Agent details
      /users/{id}:
        get:
          summary: Get user by ID
          responses:
            '200':
              description: User details

---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: sla-api
  description: REST API for SLA monitoring and deadline reminders
  tags:
    - rest
    - sla
    - deadlines
spec:
  type: openapi
  lifecycle: production
  owner: group:ticketflow-team-3
  system: ticketflow
  definition: |
    openapi: 3.0.0
    info:
      title: SLA API
      version: 1.0.0
      description: API for SLA monitoring and deadline management
    servers:
      - url: http://localhost:5054
    paths:
      /sla/{serviceType}/{serviceSourceId}/deadline-reminders:
        get:
          summary: Get deadline reminders for a service
          parameters:
            - name: serviceType
              in: path
              required: true
              schema:
                type: string
            - name: serviceSourceId
              in: path
              required: true
              schema:
                type: string
