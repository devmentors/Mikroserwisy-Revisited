            '200':
              description: List of deadline reminders

---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: communication-api
  description: REST API for alerts, messages, and notifications
  tags:
    - rest
    - alerts
    - messages
spec:
  type: openapi
  lifecycle: production
  owner: group:ticketflow-team-3
  system: ticketflow
  definition: |
    openapi: 3.0.0
    info:
      title: Communication API
      version: 1.0.0
      description: API for alerts and messaging
    servers:
      - url: http://localhost:5148
    paths:
      /alerts:
        get:
          summary: Get recent alerts
          parameters:
            - name: onlyUnread
              in: query
              schema:
                type: boolean
                default: false
          responses:
            '200':
              description: List of alerts (max 10)
      /alerts/{alertId}:
        put:
          summary: Mark alert as read/unread
          parameters:
            - name: alertId
              in: path
              required: true
              schema:
                type: string
            - name: isRead
              in: query
              required: true
              schema:
                type: boolean
          responses:
            '200':
              description: Alert updated
      /logged-users/{userId}/messages:
        get:
          summary: Get messages for logged-in user
          parameters:
            - name: userId
              in: path
              required: true
              schema:
                type: string
            - name: onlyUnread
              in: query
              schema:
                type: boolean
            - name: page
              in: query
              schema:
                type: integer
            - name: limit
              in: query
              schema:
                type: integer
          responses:
            '200':
              description: List of messages
      /anonymous-users/messages:
        get:
          summary: Get messages for anonymous users
          parameters:
            - name: onlyUnread
              in: query
              schema:
                type: boolean
            - name: page
              in: query
              schema:
                type: integer
            - name: limit
              in: query
              schema:
                type: integer
          responses:
            '200':
              description: List of messages
      /messages/{messageId}:
        put:
          summary: Mark message as read/unread
          parameters:
            - name: messageId
              in: path
              required: true
              schema:
                type: string
            - name: isRead
              in: query
              required: true
              schema:
                type: boolean
          responses:
            '200':
              description: Message updated
      /messages:
        post:
          summary: Create new message
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  type: object
          responses:
            '201':
              description: Message created

---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: translations-api
  description: REST API for text translation services
  tags:
    - rest
    - translations
    - i18n
spec:
  type: openapi
  lifecycle: production
  owner: group:ticketflow-team-2
  system: ticketflow
  definition: |
    openapi: 3.0.0
    info:
      title: Translations API
      version: 1.0.0
      description: API for text translation
    servers:
      - url: http://localhost:5200
    paths:
      /:
        get:
          summary: Health check
          responses:
            '200':
              description: Service is healthy
      /translations:
        post:
          summary: Request translation synchronously
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    text:
                      type: string
                    sourceLanguage:
                      type: string
                    targetLanguage:
                      type: string
          responses:
            '200':
              description: Translated text

---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: system-metrics-api
  description: SignalR hub for real-time system metrics streaming
  tags:
    - signalr
    - websocket
    - metrics
    - realtime
spec:
  type: asyncapi
  lifecycle: production
  owner: group:ticketflow-team-2
  system: ticketflow
  definition: |
    asyncapi: 2.6.0
    info:
      title: System Metrics API
      version: 1.0.0
      description: Real-time metrics streaming via SignalR
    servers:
      local:
        url: ws://localhost:5231/live-metrics
        protocol: ws
    channels:
      /live-metrics:
        subscribe:
          summary: Subscribe to real-time system metrics
          message:
            payload:
              type: object
              properties:
                timestamp:
                  type: string
                  format: date-time
                metrics:
                  type: object
